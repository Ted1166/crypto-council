services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_PATH: /srv/data/council.db
      CORS_ORIGINS: http://localhost:8080
    volumes:
      - council-data:/srv/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  council-data:
